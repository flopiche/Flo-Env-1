<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirakl Product Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .score-ring { stroke-dasharray: 251; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .severity-BLOQUANT { @apply bg-red-100 text-red-700 border-red-200; }
    .severity-IMPORTANT { @apply bg-orange-100 text-orange-700 border-orange-200; }
    .severity-MINEUR { @apply bg-yellow-100 text-yellow-700 border-yellow-200; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

<!-- Header -->
<header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center">
      <i data-lucide="bot" class="text-white w-5 h-5"></i>
    </div>
    <div>
      <h1 class="text-lg font-bold text-gray-900">Mirakl Product Agent</h1>
      <p class="text-xs text-gray-500">Analyse IA des produits en attente de validation</p>
    </div>
  </div>
  <button onclick="triggerAnalysis()" id="analyzeBtn"
    class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors">
    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
    Analyser nouveaux produits
  </button>
</header>

<!-- Stats -->
<div class="px-6 py-5 grid grid-cols-4 gap-4 max-w-7xl mx-auto" id="stats">
  <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
    <p class="text-xs text-gray-500 mb-1">En attente</p>
    <p class="text-3xl font-bold text-indigo-600" id="stat-pending">—</p>
  </div>
  <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
    <p class="text-xs text-gray-500 mb-1">Validés</p>
    <p class="text-3xl font-bold text-green-600" id="stat-approved">—</p>
  </div>
  <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
    <p class="text-xs text-gray-500 mb-1">Refusés</p>
    <p class="text-3xl font-bold text-red-500" id="stat-rejected">—</p>
  </div>
  <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm">
    <p class="text-xs text-gray-500 mb-1">Total analysés</p>
    <p class="text-3xl font-bold text-gray-700" id="stat-total">—</p>
  </div>
</div>

<!-- Filter tabs -->
<div class="px-6 max-w-7xl mx-auto mb-4">
  <div class="flex gap-2">
    <button onclick="setFilter('all')" id="tab-all"
      class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium border border-indigo-200 bg-indigo-600 text-white">
      Tous
    </button>
    <button onclick="setFilter('pending')" id="tab-pending"
      class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium border border-gray-200 bg-white text-gray-600 hover:border-indigo-300">
      En attente
    </button>
    <button onclick="setFilter('approved')" id="tab-approved"
      class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium border border-gray-200 bg-white text-gray-600 hover:border-green-300">
      Validés
    </button>
    <button onclick="setFilter('rejected')" id="tab-rejected"
      class="tab-btn px-4 py-1.5 rounded-full text-sm font-medium border border-gray-200 bg-white text-gray-600 hover:border-red-300">
      Refusés
    </button>
  </div>
</div>

<!-- Product list -->
<main class="px-6 pb-10 max-w-7xl mx-auto space-y-4" id="product-list">
  <div class="text-center py-16 text-gray-400">
    <i data-lucide="loader-2" class="w-8 h-8 mx-auto mb-3 animate-spin"></i>
    <p>Chargement…</p>
  </div>
</main>

<!-- Detail modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl fade-in">
    <div id="modal-content" class="p-6"></div>
  </div>
</div>

<script>
let currentFilter = 'all';
let allProducts = [];

async function loadData() {
  const [products, stats] = await Promise.all([
    fetch('/api/products').then(r => r.json()),
    fetch('/api/stats').then(r => r.json())
  ]);
  allProducts = products;
  document.getElementById('stat-pending').textContent = stats.pending;
  document.getElementById('stat-approved').textContent = stats.approved;
  document.getElementById('stat-rejected').textContent = stats.rejected;
  document.getElementById('stat-total').textContent = stats.total;
  renderProducts();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = 'tab-btn px-4 py-1.5 rounded-full text-sm font-medium border border-gray-200 bg-white text-gray-600 hover:border-indigo-300';
  });
  const active = document.getElementById('tab-' + f);
  active.className = 'tab-btn px-4 py-1.5 rounded-full text-sm font-medium border border-indigo-200 bg-indigo-600 text-white';
  renderProducts();
}

function renderProducts() {
  const filtered = currentFilter === 'all' ? allProducts : allProducts.filter(p => p.status === currentFilter);
  const container = document.getElementById('product-list');
  if (!filtered.length) {
    container.innerHTML = `<div class="text-center py-16 text-gray-400">
      <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-3"></i>
      <p>Aucun produit ici</p>
    </div>`;
    lucide.createIcons();
    return;
  }
  container.innerHTML = filtered.map(p => productCard(p)).join('');
  lucide.createIcons();
}

function scoreColor(s) {
  if (s >= 75) return '#22c55e';
  if (s >= 50) return '#f59e0b';
  return '#ef4444';
}

function recoBadge(r) {
  const map = {
    'VALIDER': '<span class="inline-flex items-center gap-1 bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded-full"><i data-lucide="check-circle" class="w-3 h-3"></i>À valider</span>',
    'CORRIGER_AVANT_VALIDATION': '<span class="inline-flex items-center gap-1 bg-orange-100 text-orange-700 text-xs font-semibold px-2 py-0.5 rounded-full"><i data-lucide="alert-triangle" class="w-3 h-3"></i>Corrections requises</span>',
    'REFUSER': '<span class="inline-flex items-center gap-1 bg-red-100 text-red-700 text-xs font-semibold px-2 py-0.5 rounded-full"><i data-lucide="x-circle" class="w-3 h-3"></i>À refuser</span>',
  };
  return map[r] || r;
}

function statusBadge(s) {
  const map = {
    'pending': '<span class="bg-indigo-50 text-indigo-600 text-xs font-medium px-2 py-0.5 rounded-full">En attente</span>',
    'approved': '<span class="bg-green-50 text-green-600 text-xs font-medium px-2 py-0.5 rounded-full">Validé</span>',
    'rejected': '<span class="bg-red-50 text-red-600 text-xs font-medium px-2 py-0.5 rounded-full">Refusé</span>',
  };
  return map[s] || s;
}

function productCard(p) {
  const a = p.analysis || {};
  const score = a.score || 0;
  const offset = 251 - (score / 100) * 251;
  const col = scoreColor(score);
  const issuesCount = (a.issues || []).length;

  return `<div class="bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow p-5 fade-in cursor-pointer"
    onclick="openModal('${p.offer_id}')">
    <div class="flex items-start gap-4">
      <!-- Score ring -->
      <div class="flex-shrink-0 relative w-16 h-16">
        <svg class="w-16 h-16 -rotate-90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="40" fill="none" stroke="#e5e7eb" stroke-width="8"/>
          <circle cx="45" cy="45" r="40" fill="none" stroke="${col}" stroke-width="8"
            class="score-ring" style="stroke-dashoffset:${offset}"/>
        </svg>
        <span class="absolute inset-0 flex items-center justify-center text-sm font-bold" style="color:${col}">${score}</span>
      </div>
      <!-- Info -->
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-1 flex-wrap">
          <h3 class="font-semibold text-gray-900 truncate">${p.product?.title || p.offer_id}</h3>
          ${statusBadge(p.status)}
        </div>
        <div class="flex items-center gap-3 text-xs text-gray-500 mb-2 flex-wrap">
          <span>${p.product?.shop_name || '—'}</span>
          ${p.product?.brand ? `<span>· ${p.product.brand}</span>` : ''}
          ${p.product?.price ? `<span>· ${p.product.price} €</span>` : ''}
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          ${recoBadge(a.recommendation)}
          ${issuesCount > 0 ? `<span class="text-xs text-gray-400">${issuesCount} problème${issuesCount > 1 ? 's' : ''} détecté${issuesCount > 1 ? 's' : ''}</span>` : ''}
        </div>
        ${a.summary ? `<p class="text-xs text-gray-500 mt-2 italic">${a.summary}</p>` : ''}
      </div>
      <!-- Actions (only if pending) -->
      ${p.status === 'pending' ? `
      <div class="flex flex-col gap-2 flex-shrink-0" onclick="event.stopPropagation()">
        <button onclick="validateProduct('${p.offer_id}')"
          class="flex items-center gap-1 bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-green-700 transition-colors font-medium">
          <i data-lucide="check" class="w-3 h-3"></i> Valider
        </button>
        <button onclick="rejectProduct('${p.offer_id}')"
          class="flex items-center gap-1 bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-red-600 transition-colors font-medium">
          <i data-lucide="x" class="w-3 h-3"></i> Refuser
        </button>
      </div>` : ''}
    </div>
  </div>`;
}

function openModal(offerId) {
  const p = allProducts.find(x => x.offer_id === offerId);
  if (!p) return;
  const a = p.analysis || {};
  const issues = (a.issues || []).map(i => `
    <div class="flex gap-2 items-start p-2 rounded-lg border text-xs
      ${i.severity === 'BLOQUANT' ? 'bg-red-50 border-red-200 text-red-700' :
        i.severity === 'IMPORTANT' ? 'bg-orange-50 border-orange-200 text-orange-700' :
        'bg-yellow-50 border-yellow-200 text-yellow-700'}">
      <span class="font-semibold shrink-0">${i.severity}</span>
      <span><strong>${i.field}</strong> — ${i.message}</span>
    </div>`).join('');

  const strengths = (a.strengths || []).map(s =>
    `<li class="flex items-center gap-1 text-sm text-green-700"><i data-lucide="check" class="w-3 h-3"></i>${s}</li>`
  ).join('');

  document.getElementById('modal-content').innerHTML = `
    <div class="flex justify-between items-start mb-4">
      <h2 class="text-lg font-bold text-gray-900 pr-4">${p.product?.title || p.offer_id}</h2>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 shrink-0">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Product info -->
    <div class="bg-gray-50 rounded-xl p-4 mb-4 text-sm space-y-1">
      ${p.product?.shop_name ? `<div class="flex gap-2"><span class="text-gray-500 w-24 shrink-0">Vendeur</span><span class="font-medium">${p.product.shop_name}</span></div>` : ''}
      ${p.product?.category ? `<div class="flex gap-2"><span class="text-gray-500 w-24 shrink-0">Catégorie</span><span>${p.product.category}</span></div>` : ''}
      ${p.product?.price ? `<div class="flex gap-2"><span class="text-gray-500 w-24 shrink-0">Prix</span><span>${p.product.price} €</span></div>` : ''}
    </div>

    <!-- Strengths -->
    ${strengths ? `<div class="mb-4"><h3 class="text-sm font-semibold text-gray-700 mb-2">Points forts</h3><ul class="space-y-1">${strengths}</ul></div>` : ''}

    <!-- Issues -->
    ${issues ? `<div class="mb-4"><h3 class="text-sm font-semibold text-gray-700 mb-2">Problèmes détectés</h3><div class="space-y-2">${issues}</div></div>` : ''}

    <!-- Conformity stats -->
    ${a.conformity ? `
    <div class="mb-4 bg-indigo-50 rounded-xl p-4 text-sm grid grid-cols-4 gap-3 text-center">
      <div><p class="text-xs text-gray-500">EAN total</p><p class="font-bold text-indigo-700">${a.conformity.total_ean}</p></div>
      <div><p class="text-xs text-gray-500">Conformes</p><p class="font-bold text-green-600">${a.conformity.conformes}</p></div>
      <div><p class="text-xs text-gray-500">Non conformes</p><p class="font-bold text-red-500">${a.conformity.non_conformes}</p></div>
      <div><p class="text-xs text-gray-500">Taux</p><p class="font-bold text-gray-700">${a.conformity.taux}</p></div>
    </div>` : ''}

    <!-- Asana recap -->
    ${a.asana_recap ? `
    <div class="mb-4 bg-gray-50 border border-gray-200 rounded-xl p-3">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Récap Asana</h3>
      <p class="text-xs text-gray-700">${a.asana_recap}</p>
    </div>` : ''}

    <!-- Seller message -->
    <div class="mb-5">
      <h3 class="text-sm font-semibold text-gray-700 mb-2">Mail vendeur (modifiable)</h3>
      <textarea id="seller-msg-${p.offer_id}" rows="6"
        class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-transparent resize-none">${a.seller_message || ''}</textarea>
      <button onclick="saveMessage('${p.offer_id}')"
        class="mt-2 text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg hover:bg-indigo-700 transition-colors">
        Sauvegarder le message
      </button>
    </div>

    <!-- Actions -->
    ${p.status === 'pending' ? `
    <div class="flex gap-3 pt-4 border-t border-gray-100">
      <button onclick="validateProduct('${p.offer_id}'); closeModal()"
        class="flex-1 bg-green-600 text-white py-2.5 rounded-xl font-semibold hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
        <i data-lucide="check-circle" class="w-4 h-4"></i> Valider le produit
      </button>
      <button onclick="rejectProduct('${p.offer_id}'); closeModal()"
        class="flex-1 bg-red-500 text-white py-2.5 rounded-xl font-semibold hover:bg-red-600 transition-colors flex items-center justify-center gap-2">
        <i data-lucide="x-circle" class="w-4 h-4"></i> Refuser le produit
      </button>
    </div>` : `<div class="pt-4 border-t border-gray-100 text-sm text-center text-gray-500">${p.status === 'approved' ? '✅ Ce produit a été validé' : '❌ Ce produit a été refusé'}</div>`}
  `;
  document.getElementById('modal').classList.remove('hidden');
  lucide.createIcons();
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

async function validateProduct(offerId) {
  await fetch(`/api/products/${offerId}/validate`, { method: 'POST' });
  await loadData();
}

async function rejectProduct(offerId) {
  await fetch(`/api/products/${offerId}/reject`, { method: 'POST' });
  await loadData();
}

async function saveMessage(offerId) {
  const msg = document.getElementById('seller-msg-' + offerId).value;
  await fetch(`/api/products/${offerId}/message`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg })
  });
  const btn = event.target;
  btn.textContent = '✓ Sauvegardé';
  setTimeout(() => btn.textContent = 'Sauvegarder le message', 2000);
}

async function triggerAnalysis() {
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Analyse en cours…';
  lucide.createIcons();
  await fetch('/api/analyze', { method: 'POST' });
  await loadData();
  btn.disabled = false;
  btn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4"></i> Analyser nouveaux produits';
  lucide.createIcons();
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
